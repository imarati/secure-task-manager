spring:
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
  datasource:
    url: jdbc:postgresql://localhost:5432/mydatabase
    username: myuser
    password: mysecretpassword
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

security:
  security:
    rate-limit:
      enabled: true
      login:
        capacity: 5
        refill-tokens: 5
        refill-minutes: 1
      register:
        capacity: 3
        refill-tokens: 3
        refill-minutes: 1
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000